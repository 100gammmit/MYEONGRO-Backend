name: myeongro

services:
  api:
    image: ${IMAGE_URI:?IMAGE_URI is required}
    env_file:
      - ${MYEONGRO_ENV_DIR:?MYEONGRO_ENV_DIR is required}/backend.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 9
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION is required}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP:?CLOUDWATCH_LOG_GROUP is required}
        awslogs-stream-prefix: api
        mode: non-blocking
        max-buffer-size: 4m

  redis:
    image: redis:7.2-alpine@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION is required}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP:?CLOUDWATCH_LOG_GROUP is required}
        awslogs-stream-prefix: redis
        mode: non-blocking
        max-buffer-size: 1m

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      API_DOMAIN_NAME: ${API_DOMAIN_NAME:?API_DOMAIN_NAME is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${MYEONGRO_BUNDLE_DIR:?MYEONGRO_BUNDLE_DIR is required}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION is required}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP:?CLOUDWATCH_LOG_GROUP is required}
        awslogs-stream-prefix: caddy
        mode: non-blocking
        max-buffer-size: 1m

volumes:
  caddy-data:
  caddy-config:
