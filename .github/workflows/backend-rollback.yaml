name: Backend rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable ECR tag, normally a Git commit SHA
        required: true
        type: string

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Deploy selected image through SSM
        run: |
          chmod +x deploy/send-ssm-command.sh
          deploy/send-ssm-command.sh \
            "${{ vars.EC2_INSTANCE_ID }}" \
            "${{ env.AWS_REGION }}" \
            "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.image_tag }}" \
            "${{ vars.SSM_BACKEND_ENV_PARAMETER }}"
