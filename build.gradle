plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.15'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.myeongroorg.example'
version = '0.0.1-SNAPSHOT'
description = 'MYEONGRO-Backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    aiPreview {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    test {
        compileClasspath += sourceSets.aiPreview.output
        runtimeClasspath += sourceSets.aiPreview.output
    }
}

configurations {
    aiPreviewImplementation.extendsFrom implementation
    aiPreviewCompileOnly.extendsFrom compileOnly
    aiPreviewRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "1.1.7")
}

dependencies {
    // Database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.session:spring-session-data-redis'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // Utilities
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'cn.6tail:lunar:1.7.7'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()

    [
        'freshPostgresJdbcUrl',
        'freshPostgresUsername',
        'freshPostgresPassword',
        'freshRedisHost',
        'freshRedisPort'
    ].each { propertyName ->
        if (System.getProperty(propertyName) != null) {
            systemProperty propertyName, System.getProperty(propertyName)
        }
    }
}

tasks.named('compileTestJava') {
    dependsOn tasks.named('aiPreviewClasses')
}

tasks.register('aiPreview', JavaExec) {
    group = 'verification'
    description = 'Preview tarot or saju AI output without starting the web application.'
    dependsOn tasks.named('aiPreviewClasses')
    classpath = sourceSets.aiPreview.runtimeClasspath
    mainClass = 'com.myeongro.api.aipreview.AiPreviewApplication'

    systemProperty 'ai-preview.kind', project.findProperty('kind') ?: ''
    systemProperty 'ai-preview.case', project.findProperty('case') ?: ''
    systemProperty 'ai-preview.execute', project.findProperty('execute') ?: 'false'
    systemProperty 'spring.config.import', 'optional:file:./config/application-secret.yaml'
    systemProperty 'spring.main.banner-mode', 'off'
    systemProperty 'spring.profiles.active', 'ai-preview'
    systemProperty 'logging.level.root', 'warn'
    def previewModel = providers.gradleProperty('model').orNull
    if (previewModel != null) {
        systemProperty 'app.reading.openai.model', previewModel
    }
}

tasks.register('dailyCardContentValidate', JavaExec) {
    group = 'verification'
    description = 'Validate agent-authored pilot or release daily-card content without an AI API call.'
    dependsOn tasks.named('aiPreviewClasses')
    classpath = sourceSets.aiPreview.runtimeClasspath
    mainClass = 'com.myeongro.api.dailycontent.DailyCardContentValidatorApplication'

    doFirst {
        if (!project.hasProperty('inputFile') || project.property('inputFile').toString().isBlank()) {
            throw new GradleException('dailyCardContentValidate requires -PinputFile=...')
        }
    }

    systemProperty 'daily-content.input-file', project.findProperty('inputFile') ?: ''
    systemProperty 'daily-content.mode', project.findProperty('mode') ?: 'pilot'
    systemProperty 'daily-content.cards', project.findProperty('cards') ?: ''
}
