spring:
  application:
    name: MYEONGRO-AI-Preview
  config:
    import: optional:classpath:config/application-secret.yaml
  main:
    banner-mode: off
  ai:
    openai:
      api-key: ${openai.api-key:}

app:
  reading:
    openai:
      model: ${openai.model:gpt-5.6-luna}
    prompts:
      tarot:
        common: classpath:prompts/tarot/common-ko-v6.md
        cards: classpath:prompts/tarot/arcana/major/major-arcana-ko-v4.md
        spreads:
          daily-one-card: classpath:prompts/tarot/spreads/daily-one-card/daily-one-card-ko-v4.md
          mind-three-card: classpath:prompts/tarot/spreads/mind-three-card/mind-three-card-ko-v4.md
          relationship-three-card: classpath:prompts/tarot/spreads/relationship-three-card/relationship-three-card-ko-v4.md
          choice-five-card: classpath:prompts/tarot/spreads/choice-five-card/choice-five-card-ko-v4.md
      saju:
        common: classpath:prompts/saju/common-ko-v1.md
        interpretation: classpath:prompts/saju/interpretation/interpretation-guide-ko-v1.md
        reports:
          birth-annual-question: classpath:prompts/saju/reports/birth-annual-question/birth-annual-question-ko-v1.md

logging:
  level:
    root: warn
