spring:
  config:
    activate:
      on-profile: prod

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: MYEONGRO_SESSION
        http-only: true
        secure: true
        same-site: lax

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
