spring:
  application:
    name: MYEONGRO-Backend

  profiles:
    active: dev

  config:
    import: optional:classpath:application-secret.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  ai:
    openai:
      api-key: ${openai.api-key:}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${oauth.kakao.client-id}
            client-secret: ${oauth.kakao.client-secret}
            redirect-uri: ${oauth.kakao.redirect-uri}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
                - profile_nickname
        provider:
            kakao:
                authorization-uri: https://kauth.kakao.com/oauth/authorize
                token-uri: https://kauth.kakao.com/oauth/token
                user-info-uri: https://kapi.kakao.com/v2/user/me
                user-name-attribute: id
app:
  frontend-origin: ${frontend.origin:http://localhost:3000}
  reading:
    generator: demo
    prompt-version: mvp-2026-06-16
    openai:
      model: ${openai.free-model:gpt-5.4-mini}
      max-output-tokens: 1200
  guest:
    signing-secret: ${guest.secret}
    ttl: 30d
  consent:
    versions:
      terms: 2026-06-10
      privacy: 2026-06-10
      sensitive-data: 2026-06-10

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
