spring:
  application:
    name: MYEONGRO-Backend

  config:
    import: optional:file:./config/application-secret.yaml

  datasource:
    url: ${database.url}
    username: ${database.username}
    password: ${database.password}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${redis.host:localhost}
      port: ${redis.port:6379}
      password: ${redis.password:}

  session:
    redis:
      repository-type: default
      namespace: myeongro:session
      flush-mode: on_save

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  ai:
    openai:
      api-key: ${openai.api-key:}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${oauth.kakao.client-id}
            client-secret: ${oauth.kakao.client-secret}
            redirect-uri: ${oauth.kakao.redirect-uri}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
          google:
            client-id: ${oauth.google.client-id}
            client-secret: ${oauth.google.client-secret}
            redirect-uri: ${oauth.google.redirect-uri}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            scope:
              - openid
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: MYEONGRO_SESSION
        http-only: true
        secure: false
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  frontend-origin: ${frontend.origin:http://localhost:3000}

  reading:
    tarot-selection-secret: ${tarot.selection-secret}
    openai:
      model: ${openai.model:gpt-5.6-luna}
    prompts:
      tarot:
        common: classpath:prompts/tarot/common-ko-v18.md
        cards: classpath:prompts/tarot/arcana/major/major-arcana-ko-v4.md
        spreads:
          daily-one-card: classpath:prompts/tarot/spreads/daily-one-card/daily-one-card-ko-v6.md
          mind-three-card: classpath:prompts/tarot/spreads/mind-three-card/mind-three-card-ko-v8.md
          relationship-three-card: classpath:prompts/tarot/spreads/relationship-three-card/relationship-three-card-ko-v8.md
          choice-five-card: classpath:prompts/tarot/spreads/choice-five-card/choice-five-card-ko-v8.md
      saju:
        common: classpath:prompts/saju/common-ko-v5.md
        interpretation: classpath:prompts/saju/interpretation/interpretation-guide-ko-v1.md
        reports:
          birth-annual-question: classpath:prompts/saju/reports/birth-annual-question/birth-annual-question-ko-v2.md

  consent:
    versions:
      terms: 2026-06-10
      privacy: 2026-06-10
      sensitive-data: 2026-06-10

  account:
    retention:
      purge-delay: 30d
      purge-enabled: false
      purge-batch-size: 100
      purge-cron: "0 0 4 * * *"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
