spring:
  application:
    name: MYEONGRO-Backend

  config:
    import: optional:classpath:application-secret.yaml

  data:
    redis:
      host: ${redis.host:localhost}
      port: ${redis.port:6379}

  session:
    redis:
      repository-type: default
      namespace: myeongro:session
      flush-mode: on_save

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  ai:
    openai:
      api-key: ${openai.api-key:}
      chat:
        options:
          model: ${openai.free-model:gpt-5.4-mini}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${oauth.kakao.client-id}
            client-secret: ${oauth.kakao.client-secret}
            redirect-uri: ${oauth.kakao.redirect-uri}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
          google:
            client-id: ${oauth.google.client-id}
            client-secret: ${oauth.google.client-secret}
            redirect-uri: ${oauth.google.redirect-uri}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            scope:
              - openid
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  servlet:
    session:
      timeout: 30m
app:
  frontend-origin: ${frontend.origin:http://localhost:3000}

  tarot:
    draw-session:
      namespace: myeongro:tarot-draw
      ttl: ${tarot.draw-session.ttl:30m}

  reading:
    # IP HMAC secret is separate from the retired guest cookie secret.
    ip-hash-secret: ${ip.hash-secret}
    openai:
      model: ${openai.free-model:gpt-5.4-mini}
    prompts:
      tarot:
        common: classpath:prompts/tarot/common-ko-v1.md
        cards: classpath:prompts/tarot/major-arcana-ko-v1.md
        spreads:
          daily-one-card: classpath:prompts/tarot/spreads/daily-one-card-ko-v2.md
          mind-three-card: classpath:prompts/tarot/spreads/mind-three-card-ko-v2.md
          relationship-three-card: classpath:prompts/tarot/spreads/relationship-three-card-ko-v2.md
          choice-five-card: classpath:prompts/tarot/spreads/choice-five-card-ko-v2.md
      saju: classpath:prompts/saju/birth-profile-free-ko-v1.md

  consent:
    versions:
      terms: 2026-06-10
      privacy: 2026-06-10
      sensitive-data: 2026-06-10

  account:
    retention:
      purge-delay: 30d
      purge-enabled: false
      purge-batch-size: 100
      purge-cron: "0 0 4 * * *"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
