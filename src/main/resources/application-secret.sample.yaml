database:
  url:
  username:
  password:

openai:
  api-key:
  model: gpt-5.6-luna

oauth:
  kakao:
    client-id:
    client-secret:
    redirect-uri: http://localhost:8080/login/oauth2/code/kakao
  google:
    client-id:
    client-secret:
    redirect-uri: http://localhost:8080/login/oauth2/code/google

frontend:
  origin: http://localhost:3000

# 아래 세 HMAC 키는 모두 최소 32바이트의 안정적인 임의 문자열이며, 서로 다른 값을 쓰고
# 세션/OAuth/API secret과도 분리한다. 같은 값이면 애플리케이션이 기동하지 않는다.
tarot:
  # 타로 슬롯 -> 카드 순위 결정 전용. 바꾸면 같은 요청의 카드 결과가 달라진다.
  selection-secret:
  # 타로 요청 멱등성 지문(질문·선택지·카드) 전용. 바꾸면 기존 requestId 재시도가 충돌한다.
  idempotency-secret:

saju:
  # 사주 요청 멱등성 지문(출생정보·질문) 전용. 바꾸면 기존 requestId 재시도가 충돌한다.
  idempotency-secret:

# 운영 Redis에 password가 필요한 경우에만 실제 secret 파일에 추가
