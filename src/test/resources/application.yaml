spring:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  ai:
    openai:
      api-key: test-only
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: http://localhost/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:

  tarot:
    draw-session:
      namespace: myeongro:test:tarot-draw
      ttl: 30m

  reading:
    # Test-only HMAC secret.
    ip-hash-secret: 0123456789abcdef0123456789abcdef
    openai:
      model: gpt-test
    prompts:
      tarot:
        common: classpath:prompts/tarot/common-ko-v1.md
        cards: classpath:prompts/tarot/major-arcana-ko-v1.md
        spreads:
          daily-one-card: classpath:prompts/tarot/spreads/daily-one-card-ko-v1.md
          mind-three-card: classpath:prompts/tarot/spreads/mind-three-card-ko-v1.md
          relationship-three-card: classpath:prompts/tarot/spreads/relationship-three-card-ko-v1.md
          choice-five-card: classpath:prompts/tarot/spreads/choice-five-card-ko-v1.md
  consent:
    versions:
      terms: 2026-06-10
      privacy: 2026-06-10
      sensitive-data: 2026-06-10
