spring:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  ai:
    openai:
      api-key: test-only
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: http://localhost/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  reading:
    openai:
      model: gpt-test
      max-output-tokens: 1200
    prompts:
      tarot: classpath:prompts/tarot/major-arcana-3card-ko-v1.md
      tarot-version: tarot-prompt-v1
  guest:
    signing-secret: 0123456789abcdef0123456789abcdef
    ttl: 30d
    cookie-secure: false
  consent:
    versions:
      terms: 2026-06-10
      privacy: 2026-06-10
      sensitive-data: 2026-06-10
