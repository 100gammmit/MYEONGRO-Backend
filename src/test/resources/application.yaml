spring:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  ai:
    openai:
      api-key: test-only
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: http://localhost/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:

  reading:
    tarot-selection-secret: test-only-tarot-selection-secret-32-bytes
    # Test-only HMAC secret.
    openai:
      model: gpt-test
    prompts:
      tarot:
        common: classpath:prompts/tarot/common-ko-v6.md
        cards: classpath:prompts/tarot/arcana/major/major-arcana-ko-v4.md
        spreads:
          daily-one-card: classpath:prompts/tarot/spreads/daily-one-card/daily-one-card-ko-v4.md
          mind-three-card: classpath:prompts/tarot/spreads/mind-three-card/mind-three-card-ko-v4.md
          relationship-three-card: classpath:prompts/tarot/spreads/relationship-three-card/relationship-three-card-ko-v4.md
          choice-five-card: classpath:prompts/tarot/spreads/choice-five-card/choice-five-card-ko-v4.md
      saju:
        common: classpath:prompts/saju/common-ko-v1.md
        interpretation: classpath:prompts/saju/interpretation/interpretation-guide-ko-v1.md
        reports:
          birth-annual-question: classpath:prompts/saju/reports/birth-annual-question/birth-annual-question-ko-v1.md
  reading-credits:
    daily-free-grant: 10
    costs:
      tarot:
        daily-one-card: 1
        mind-three-card: 2
        relationship-three-card: 2
        choice-five-card: 3
      saju: 4
    stale-after: 5m
    cleanup-cron: "0 */5 * * * *"
  consent:
    versions:
      terms: 2026-06-10
      privacy: 2026-06-10
      sensitive-data: 2026-06-10
